- name: Git personal setup email
  git_config:
    name: user.email
    scope: global
    value: "{{ user_email }}"

- name: Git personal setup name
  git_config:
    name: user.name
    scope: global
    value: "{{ user_full_name }}"

- name: Set default branch to main
  git_config:
    name: init.defaultBranch
    scope: global
    value: main

- name: Set pull.rebase to true
  git_config:
    name: pull.rebase
    scope: global
    value: "true"

- name: Write work git identity
  copy:
    dest: "{{ lookup('env', 'HOME') }}/.gitconfig-work"
    mode: 0644
    content: |
      [user]
      	email = {{ work_email }}
  when: work_email is defined

- name: Use work identity for repos cloned from the work GitHub org
  git_config:
    name: "includeIf.hasconfig:remote.*.url:{{ item }}.path"
    scope: global
    value: "{{ lookup('env', 'HOME') }}/.gitconfig-work"
  loop:
    - "git@github.com:{{ work_github_org }}/**"
    - "https://github.com/{{ work_github_org }}/**"
  when: work_email is defined
