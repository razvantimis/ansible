- name: Git personal setup email
  git_config:
    name: user.email
    scope: global
    value: "{{ user_email }}"

- name: Git personal setup name
  git_config:
    name: user.name
    scope: global
    value: "{{ user_full_name }}"

- name: Set default branch to main
  git_config:
    name: init.defaultBranch
    scope: global
    value: main

- name: Set pull.rebase to true
  git_config:
    name: pull.rebase
    scope: global
    value: "true"

- name: Ensure work repos directory exists
  file:
    path: "{{ work_repos_dir }}"
    state: directory
  when: work_email is defined

- name: Write work git identity
  copy:
    dest: "{{ lookup('env', 'HOME') }}/.gitconfig-work"
    mode: 0644
    content: |
      [user]
      	email = {{ work_email }}
  when: work_email is defined

- name: Use work identity for repos under work_repos_dir
  git_config:
    name: 'includeIf.gitdir:{{ work_repos_dir }}/.path'
    scope: global
    value: "{{ lookup('env', 'HOME') }}/.gitconfig-work"
  when: work_email is defined
