- name: Install homebrew packages
  homebrew:
    name: "{{ brew_packages }}"
    state: present
    update_homebrew: yes

- name: Create docker config dir
  file:
    path: "{{ lookup('env', 'HOME') }}/.docker"
    state: directory
    mode: 0700

# Only seeds a fresh machine; an existing config.json (registry creds) is left alone.
- name: Let docker find brew's compose and buildx plugins
  copy:
    dest: "{{ lookup('env', 'HOME') }}/.docker/config.json"
    content: |
      {
        "cliPluginsExtraDirs": ["/opt/homebrew/lib/docker/cli-plugins"]
      }
    force: false

- name: Start colima at login
  command: brew services start colima
  changed_when: false

# adopt: take over apps that were installed by hand (or by IT) instead of failing.
# Adopting a root-owned app makes brew sudo chmod it; there is no tty for sudo
# under ansible, so hand it the become password.
- name: Install homebrew cask packages
  homebrew_cask:
    name: "{{ item }}"
    state: present
    install_options: adopt
    sudo_password: "{{ ansible_become_password | default(omit) }}"
  loop: "{{ brew_cask_packages + profile_cask_packages | default([]) }}"

- name: Install VSCode extensions
  shell: code --install-extension {{ item }}
  loop: "{{ vscode_extensions }}"
  changed_when: false
