- name: Install Meslo Nerd Font (powerlevel10k glyphs)
  homebrew_cask:
    name: font-meslo-lg-nerd-font
    state: present

- name: Install Ghostty
  homebrew_cask:
    name: ghostty
    state: present

- name: Install tmux
  homebrew:
    name: tmux
    state: present

- name: Clone TPM repository
  git:
    repo: 'https://github.com/tmux-plugins/tpm.git'
    dest: "{{ lookup('env', 'HOME') }}/.tmux/plugins/tpm"

- name: Check if oh-my-zsh is installed
  stat:
    path: ~/.oh-my-zsh
  register: oh_my_stats

- name: Install oh-my-zsh
  shell: curl -L https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh > ~/.oh-my-installer && chmod +x ~/.oh-my-installer && ~/.oh-my-installer --unattended
  when: not oh_my_stats.stat.exists

- name: Install zsh plugins and powerlevel10k
  homebrew:
    name:
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - powerlevel10k
    state: present
