# Installed via mise (tasks/runtimes.yml); any tool@version mise understands
mise_tools:
  - node@lts
  - java@temurin-21
  - python@3

# Global npm CLIs, also via mise
npm_packages:
  - pnpm

# Shared by every profile; per-profile extras live in vars/profiles/*.yml
brew_cask_packages:
  - vivaldi
  - google-chrome
  - firefox
  - microsoft-edge
  - visual-studio-code
  - vlc

brew_packages:
  - go
  - git
  - gh
  - lazygit
  - bun
  # containers: colima VM + docker CLI, no Docker Desktop
  - colima
  - docker
  - docker-compose
  - docker-buildx

vscode_extensions:
  - dbaeumer.vscode-eslint
  - eamodio.gitlens
  - yzhang.markdown-all-in-one
  - zhuangtongfa.material-theme
  - bierner.markdown-mermaid
  - esbenp.prettier-vscode
